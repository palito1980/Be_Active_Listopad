<title>Aktywny listopad 2026 — Wyniki na żywo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#3a2e22;padding-bottom:4rem;position:relative;min-height:100vh;
  background:linear-gradient(180deg,#dbe0d6 0%,#efe2c4 34%,#eccb92 64%,#e3ad6a 100%);background-attachment:fixed}
.bg-scene{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.bg-scene svg{position:absolute;bottom:0;left:0;width:100%;height:auto;min-height:340px}
.bg-sun{position:fixed;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;z-index:-2;pointer-events:none;
  background:radial-gradient(circle,#f6d98f 0%,#efbf5e 45%,rgba(239,191,94,0) 72%)}
.bg-float{position:fixed;z-index:-1;opacity:.13;pointer-events:none;user-select:none}
.f1{bottom:14%;left:5%;font-size:3.4rem;transform:rotate(-8deg)}
.f2{top:24%;right:7%;font-size:2.9rem;transform:rotate(10deg)}
.f3{bottom:30%;right:12%;font-size:2.4rem}
@media(max-width:600px){.bg-float{opacity:.10}.f1{font-size:2.6rem}.f2{font-size:2.2rem}.f3{font-size:1.9rem}}
.site-title{max-width:1100px;margin:0 auto;padding:.7rem .85rem .3rem;font-weight:900;font-size:1.15rem;letter-spacing:-.01em;color:#9c4a16;display:flex;align-items:center;gap:.4rem}
.sticky{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#b4531d 0%,#cc7a26 100%);color:#fff;padding:.6rem .85rem;box-shadow:0 2px 12px rgba(140,70,20,.35)}
.sticky-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.sc{display:flex;align-items:center;gap:.5rem;flex:1;min-width:0}
.sc-pts{font-weight:900;font-size:1.15rem}
.sc-name{font-size:.74rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-indicator{flex-basis:100%;text-align:center;font-size:.65rem;font-weight:700;letter-spacing:.05em;opacity:.9;padding-top:.2rem;cursor:pointer}
.info-bar{max-width:1100px;margin:.65rem auto .2rem;padding:0 .75rem}
.info-box{background:rgba(255,255,255,.82);backdrop-filter:blur(4px);border-radius:10px;padding:.6rem .85rem;font-size:.78rem;color:#5a4632;border-left:3px solid #d9641e}
.tab-wrap{max-width:1100px;margin:.5rem auto 0;padding:0 .75rem}
.tab-bar{display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);border-radius:10px 10px 0 0;border-bottom:2px solid #e8d8c4;overflow:hidden}
.tab-bar label{flex:1;text-align:center;padding:.6rem .35rem;font-size:.8rem;font-weight:700;color:#9a8470;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab-bar label.active{color:#9c4a16;border-bottom:3px solid #d9641e;margin-bottom:-2px}
.tab-pane{display:none}
.tab-pane.active{display:block}
.panel{background:rgba(255,255,255,.94);border-radius:0 0 12px 12px;overflow:hidden;box-shadow:0 2px 10px rgba(140,70,20,.12)}
.row{display:flex;align-items:center;gap:10px;padding:.6rem .8rem;border-bottom:1px solid #f0e6d8;cursor:pointer}
.row:last-child{border-bottom:none}
.row.top1{background:linear-gradient(90deg,#fff6df,#fdeccf)}
.row.top2{background:linear-gradient(90deg,#fbf2e8,#f7ece0)}
.row.top3{background:linear-gradient(90deg,#fdeee4,#fae6da)}
.rk{width:30px;text-align:center;font-weight:900;font-size:1rem;color:#c87a2c;flex-shrink:0}
.rk.med{font-size:1.25rem}
.nm{flex:1;min-width:0}
.nm b{font-weight:800;font-size:.98rem;color:#3a2a1e}
.nm .sub{display:block;font-size:.68rem;color:#9a8470;font-weight:600;margin-top:1px}
.pt{text-align:right;flex-shrink:0}
.pt .big{font-weight:900;font-size:1.15rem;color:#c0531d}
.pt .wk{font-size:.66rem;color:#8a9a6a;font-weight:700}
.detail{padding:.4rem .8rem .7rem;background:#fcf7ef;border-bottom:1px solid #f0e6d8}
.d-day{padding:.35rem 0;border-bottom:1px dashed #ece0cf}
.d-day:last-child{border-bottom:none}
.d-dn{font-weight:800;font-size:.73rem;color:#7a6a52;display:flex;justify-content:space-between}
.act{font-size:.8rem;line-height:1.7;margin-left:.2rem}
.ok{color:#2d8a56}.no{color:#c8392b}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th,.tbl td{padding:.5rem .55rem;text-align:center}
.tbl th{background:#f3e7d6;color:#9c4a16;font-size:.7rem;font-weight:800;position:sticky;top:0}
.tbl td:nth-child(2){text-align:left;font-weight:700;color:#3a2a1e}
.tbl tr:nth-child(even){background:#fbf3e8}
.tbl .p{font-weight:900;color:#c0531d}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding:.75rem}
.statcard{background:rgba(255,255,255,.95);border-radius:12px;padding:.75rem;box-shadow:0 2px 8px rgba(140,70,20,.1)}
.statcard .t{font-size:.66rem;color:#9a8470;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.statcard .v{font-weight:900;font-size:1.05rem;color:#3a2a1e;margin-top:.2rem}
.statcard .d{font-size:.72rem;color:#8a9a6a;font-weight:700}
.legend{background:rgba(255,255,255,.95);border-radius:12px;margin:.75rem;padding:0;overflow:hidden;box-shadow:0 2px 8px rgba(140,70,20,.1)}
.legend summary{padding:.7rem .9rem;font-weight:800;color:#9c4a16;cursor:pointer;font-size:.9rem}
.legend .lg{padding:.2rem .9rem .9rem;font-size:.8rem;line-height:1.7;color:#5a4632}
.legend .lg b{color:#3a2a1e}
details>summary{display:block;list-style:none}
details>summary::-webkit-details-marker,details>summary::marker{display:none}
.center-msg{max-width:500px;margin:3rem auto;padding:1.5rem;text-align:center;color:#6a5440;font-size:.9rem;background:rgba(255,255,255,.9);border-radius:12px;box-shadow:0 2px 10px rgba(140,70,20,.12)}
.usage{max-width:1100px;margin:.65rem auto;padding:.9rem 1rem;background:#2a2118;color:#f3e7d6;border-radius:12px;font-size:.8rem}
.usage h3{font-size:.95rem;margin-bottom:.5rem;color:#f0b65e}
.ubar{display:flex;align-items:center;gap:8px;margin:3px 0}
.ubar .ul{width:150px;font-size:.72rem;flex-shrink:0}
.ubar .ut{height:16px;background:#e0862a;border-radius:4px;min-width:2px}
.ubar .uv{font-weight:700;font-size:.72rem}
#app > div{position:relative;z-index:1}
</style>
</head>
<body>

<div class="bg-sun"></div>
<div class="bg-float f1">🍁</div>
<div class="bg-float f2">🍂</div>
<div class="bg-float f3">🌰</div>
<div class="bg-scene" aria-hidden="true">
<svg viewBox="0 0 1200 360" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
  <path d="M0 210 L200 150 L400 205 L600 150 L800 210 L1000 160 L1200 205 L1200 360 L0 360 Z" fill="#cf9f4a" opacity="0.5"/>
  <path d="M0 250 L220 200 L440 255 L660 200 L880 255 L1100 205 L1200 240 L1200 360 L0 360 Z" fill="#b2742c" opacity="0.5"/>
  <rect x="0" y="300" width="1200" height="60" fill="#8a5a2a" opacity="0.4"/>
  <g opacity="0.55"><rect x="118" y="235" width="11" height="72" rx="3" fill="#6b4423"/><circle cx="123" cy="224" r="36" fill="#d9641e"/>
    <circle cx="150" cy="236" r="26" fill="#c0391f"/><circle cx="97" cy="238" r="24" fill="#e0932a"/></g>
  <g opacity="0.5"><rect x="1048" y="242" width="9" height="64" rx="3" fill="#6b4423"/><circle cx="1052" cy="232" r="30" fill="#c0391f"/>
    <circle cx="1076" cy="242" r="22" fill="#e0932a"/><circle cx="1030" cy="244" r="18" fill="#d9641e"/></g>
</svg>
</div>

<div class="site-title">🍂 Aktywny listopad 2026</div>
<div class="sticky"><div class="sticky-inner" id="stickyInner">
  <div class="sc"><span style="font-size:1.6rem">⏳</span><div><div class="sc-pts">—</div><div class="sc-name">Wczytywanie…</div></div></div>
</div></div>

<div id="app">
  <div class="center-msg">Wczytywanie wyników…</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// PUBLICZNA TABLICA — LISTOPAD 2026 (jedna klasyfikacja, bez drużyn)
// Czyta statyczny results.json publikowany przez panel admina.
// Bez bazy, bez kluczy. Zero punktów ujemnych, bez bonusu drużynowego.
// ═══════════════════════════════════════════════════════════════
const RESULTS_URL = 'results.json';
const REFRESH_MS  = 60000;

// ── STAŁE / PUNKTACJA (te same zasady dzienne co dotąd) ──
const DIST_TYPES=[{v:'walk',l:'Spacer/marsz',mult:0.5},{v:'bike',l:'Rower',mult:0.3},{v:'swim',l:'Pływanie',mult:5.0}];
const ACT_CAP=75, TIME_MIN=30, ROWER_MIN=8, RUN_MIN=3, WALK_MIN=3, SWIM_MIN=0.8, GPS_TOL=0.05;
const DAY_TARGET=5;   // najlepsze 5 dni w tygodniu liczy się do wyniku
const ICONS={walk:'🚶',bike:'🚴',swim:'🏊',gym:'🏋️',yoga:'🧘',dance:'💃',fight:'⚔️',other:'💪'};
const LN={walk:'Spacer',bike:'Rower',swim:'Pływanie',gym:'Siłownia',yoga:'Joga/Pilates',dance:'Taniec',fight:'Walki',other:'Trening'};
const DAY_FULL=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
const DAY_SH=['Pn','Wt','Śr','Cz','Pt','Sb','Nd'];
function emptyDays(){return Array(7).fill(null).map(()=>({runs:[],distActs:[],timeActs:[]}));}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function meetsMin(km,min){return km>=min*(1-GPS_TOL);}
function timeTierPts(dur){return dur<TIME_MIN?0:(dur>=50?40:25);}
function distMult(t){return(DIST_TYPES.find(d=>d.v===t)||{mult:0}).mult;}

function calcDay(d){
  d=d||{runs:[],distActs:[],timeActs:[]};
  const validRuns=(d.runs||[]).filter(r=>meetsMin(r.km,RUN_MIN));
  const hasRun=validRuns.length>0, runKm=validRuns.reduce((s,r)=>s+r.km,0);
  const runPts=Math.min(ACT_CAP,Math.round(runKm*5*10)/10);
  const dists=(d.distActs||[]).filter(a=>a.type==='walk'?meetsMin(a.km,WALK_MIN):a.type==='bike'?meetsMin(a.km,ROWER_MIN):a.type==='swim'?meetsMin(a.km,SWIM_MIN):a.km>0);
  let distPts=0;['walk','bike','swim'].forEach(tp=>{const km=dists.filter(a=>a.type===tp).reduce((s,a)=>s+a.km,0);if(km>0)distPts+=Math.min(ACT_CAP,Math.round(km*distMult(tp)*5*10)/10);});
  distPts=Math.round(distPts*10)/10;
  const vt=(d.timeActs||[]).filter(a=>a.dur>=TIME_MIN);
  const timePts=vt.length?timeTierPts(Math.max.apply(null,vt.map(a=>a.dur))):0;
  const hasAny=hasRun||dists.length>0||vt.length>0;
  if(!hasAny)return{pts:0,hasRun:false,hasDistAct:false,hasTimeAct:false,runKm:0};
  return{pts:Math.round((20+runPts+distPts+timePts)*10)/10,hasRun,hasDistAct:dists.length>0,hasTimeAct:vt.length>0,runKm};
}
// Wynik tygodnia zawodnika — indywidualnie, bez kar, najlepsze 5 dni + bonus biegowy.
function calcMember(memberId,state){
  const days=state[memberId]||emptyDays();
  const db=days.map(calcDay);
  const idx=db.map((dc,i)=>({i,pts:dc.pts})).filter(o=>o.pts>0).sort((a,b)=>b.pts-a.pts);
  const counted=new Set(idx.slice(0,DAY_TARGET).map(o=>o.i));
  let dailyPts=0,totalKm=0,activeDaysAll=0,runDaysAll=0;
  db.forEach((dc,i)=>{ if(dc.pts>0)activeDaysAll++; if(dc.hasRun)runDaysAll++; if(!counted.has(i))return; if(dc.hasRun)totalKm+=dc.runKm; dailyPts+=dc.pts; });
  const runBonus=runDaysAll>=4?50:runDaysAll>=3?25:runDaysAll>=2?10:0;
  return{total:Math.round(dailyPts+runBonus),dailyPts:Math.round(dailyPts),runBonus,totalKm:Math.round(totalKm*10)/10,activeDaysAll,runDaysAll,dayBreakdown:db};
}

// ── Tydzień zabawy z daty startu (naprawia „tydzień 45") ──
function weekRangeFor(wn,challengeStart){
  const cs=new Date((challengeStart||'2026-11-02')+'T12:00:00');
  const s=new Date(cs.getTime()+(wn-1)*7*86400000), e=new Date(s.getTime()+6*86400000);
  const f=d=>d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'});
  return f(s)+' – '+f(e);
}
function currentWeekNum(challengeStart){
  const cs=new Date((challengeStart||'2026-11-02')+'T12:00:00');
  return Math.max(1,Math.floor((new Date()-cs)/(7*86400000))+1);
}

// ── Szczegóły dnia: WSZYSTKIE aktywności, ✅ zielone / ❌ czerwone ──
function actDetail(d){
  d=d||{};
  const runs=(d.runs||[]), dists=(d.distActs||[]), times=(d.timeActs||[]);
  if(!runs.length&&!dists.length&&!times.length) return '<div style="color:#bbb;font-style:italic;font-size:.78rem">— brak aktywności —</div>';
  let h='';
  runs.forEach(r=>{const ok=meetsMin(r.km,RUN_MIN);h+='<div class="act '+(ok?'ok':'no')+'">'+(ok?'✅':'❌')+' 🏃 Bieg '+r.km+' km'+(ok?' · '+Math.round(Math.min(ACT_CAP,r.km*5))+' pkt':' <span style="color:#999">(min 3 km — nie liczy się)</span>')+'</div>';});
  dists.forEach(a=>{const min=a.type==='walk'?WALK_MIN:a.type==='bike'?ROWER_MIN:a.type==='swim'?SWIM_MIN:0;const ok=min?meetsMin(a.km,min):a.km>0;const p=Math.round(Math.min(ACT_CAP,a.km*distMult(a.type)*5));h+='<div class="act '+(ok?'ok':'no')+'">'+(ok?'✅':'❌')+' '+(ICONS[a.type]||'•')+' '+(LN[a.type]||a.type)+' '+a.km+' km'+(ok?' · '+p+' pkt':' <span style="color:#999">(min '+min+' km — nie liczy się)</span>')+'</div>';});
  const sortedT=times.slice().sort((a,b)=>b.dur-a.dur);
  sortedT.forEach((a,i)=>{const ok=a.dur>=TIME_MIN;const counts=ok&&i===0;h+='<div class="act '+(counts?'ok':'no')+'">'+(counts?'✅':'❌')+' '+(ICONS[a.type]||'💪')+' '+(LN[a.type]||a.type)+' '+a.dur+' min'+(counts?' · '+timeTierPts(a.dur)+' pkt':ok?' <span style="color:#999">(liczy się 1 trening/dzień)</span>':' <span style="color:#999">(min 30 min — nie liczy się)</span>')+'</div>';});
  return h;
}

// ── GŁÓWNY RENDER ──
function renderApp(payload){
  const members=(payload&&payload.members)||[];
  if(!members.length){ document.getElementById('app').innerHTML='<div class="center-msg">Brak opublikowanych danych jeszcze. Poczekaj, aż admin zapisze wyniki.</div>'; return; }
  const state=payload.state||{};
  const lockedWeeks=payload.lockedWeeks||[];
  const challengeStart=payload.challengeStart||'2026-11-02';
  const lastUpdated=payload.lastUpdated||null;
  const monthName=payload.monthName||'Listopad 2026';
  const wn=payload.currentWeek||(lockedWeeks.length+1);   // tydzień zabawy = zamknięte tygodnie + 1

  // suma zamkniętych tygodni per zawodnik (nowy format indywidualny)
  const lockedSum={};
  members.forEach(m=>lockedSum[m.id]=0);
  lockedWeeks.forEach(w=>{ (w.results||[]).forEach(r=>{ if(lockedSum[r.id]!=null) lockedSum[r.id]+=(r.total||0); }); });

  // wynik bieżącego tygodnia (na żywo ze state)
  const rows=members.map(m=>{
    const cur=calcMember(m.id,state);
    const locked=lockedSum[m.id]||0;
    return {id:m.id,name:m.name,cur,week:cur.total,locked,cumulative:locked+cur.total};
  });
  rows.sort((a,b)=>b.cumulative-a.cumulative || b.cur.activeDaysAll-a.cur.activeDaysAll || a.name.localeCompare(b.name));

  const anyLocked=lockedWeeks.length>0;
  const leader=rows[0];
  // sticky
  document.getElementById('stickyInner').innerHTML=
    '<div class="sc"><span style="font-size:1.5rem">👑</span><div><div class="sc-pts">'+(leader?leader.cumulative+' pkt':'—')+'</div>'
    +'<div class="sc-name">Prowadzi: '+(leader?esc(leader.name):'—')+'</div></div></div>'
    +'<div class="live-indicator" id="liveIndicator" onclick="manualRefresh()">🔄 Odśwież</div>';

  const updDate=lastUpdated?new Date(lastUpdated).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';

  // ── TAB 1: Wyniki (ranking narastająco) ──
  function playerRow(r,pos){
    const med=['🥇','🥈','🥉'][pos];
    const rk=med?'<span class="rk med">'+med+'</span>':'<span class="rk">'+(pos+1)+'</span>';
    const sub=r.cur.activeDaysAll+' dni w tyg.'+(r.cur.runBonus?' · +'+r.cur.runBonus+' bieg':'')+(r.cur.totalKm?' · '+r.cur.totalKm+' km':'');
    const detail=r.cur.dayBreakdown.map((dc,di)=>
      '<div class="d-day"><div class="d-dn"><span>'+DAY_FULL[di]+'</span><span style="color:'+(dc.pts>0?'#2d8a56':'#bbb')+'">'+(dc.pts>0?Math.round(dc.pts)+' pkt':'—')+'</span></div>'
      +actDetail((state[r.id]||[])[di])+'</div>').join('');
    return '<details><summary class="row'+(pos<3?' top'+(pos+1):'')+'">'+rk
      +'<div class="nm"><b>'+esc(r.name)+'</b><span class="sub">'+sub+'</span></div>'
      +'<div class="pt"><div class="big">'+r.cumulative+'</div>'+(anyLocked?'<div class="wk">+'+r.week+' ten tydz.</div>':'<div class="wk">tydzień '+wn+'</div>')+'</div>'
      +'</summary><div class="detail">'+detail+'</div></details>';
  }
  let t1='<div class="panel">'+rows.map((r,i)=>playerRow(r,i)).join('')+'</div>'
    +'<div style="text-align:center;font-size:.7rem;color:#b09a80;padding:.6rem">Dotknij zawodnika, aby sprawdzić czy Twoje aktywności policzyły się poprawnie.</div>';

  // ── TAB 2: Klasyfikacja (pełna tabela) ──
  let t2='<div class="panel" style="overflow-x:auto"><table class="tbl"><tr><th>#</th><th>Zawodnik</th><th>Ten tydz.</th>'
    +(anyLocked?'<th>Razem</th>':'')+'<th>Dni</th><th>Km</th></tr>'
    +rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+r.week+'</td>'
      +(anyLocked?'<td class="p">'+r.cumulative+'</td>':'')+'<td>'+r.cur.activeDaysAll+'</td><td>'+r.cur.totalKm+'</td></tr>').join('')
    +'</table></div>';

  // ── TAB 3: Statystyki (bieżący tydzień) ──
  function leaderOf(valFn,unit){ let best=null; rows.forEach(r=>{const v=valFn(r);if(v>0&&(!best||v>best.v))best={name:r.name,v};}); return best?('<div class="v">'+best.name+'</div><div class="d">'+best.v+' '+unit+'</div>'):'<div class="v" style="color:#bbb">—</div>'; }
  const timeMin=r=>(state[r.id]||[]).reduce((s,d)=>s+(d.timeActs||[]).filter(a=>a.dur>=30).reduce((x,a)=>Math.max(x,a.dur),0),0);
  const bikeKm=r=>(state[r.id]||[]).reduce((s,d)=>s+(d.distActs||[]).filter(a=>a.type==='bike').reduce((x,a)=>x+a.km,0),0);
  const walkKm=r=>(state[r.id]||[]).reduce((s,d)=>s+(d.distActs||[]).filter(a=>a.type==='walk'&&a.km>=3).reduce((x,a)=>x+a.km,0),0);
  const bestDay=r=>Math.round(Math.max(0,...r.cur.dayBreakdown.map(d=>d.pts||0)));
  let t3='<div style="text-align:center;font-size:.72rem;color:#9a8470;padding:.5rem 0 0">Bieżący tydzień ('+weekRangeFor(wn,challengeStart)+')</div><div class="statgrid">'
    +'<div class="statcard"><div class="t">🏃 Najwięcej km (bieg)</div>'+leaderOf(r=>r.cur.totalKm,'km')+'</div>'
    +'<div class="statcard"><div class="t">📅 Najwięcej aktywnych dni</div>'+leaderOf(r=>r.cur.activeDaysAll,'dni')+'</div>'
    +'<div class="statcard"><div class="t">⭐ Najlepszy dzień</div>'+leaderOf(bestDay,'pkt')+'</div>'
    +'<div class="statcard"><div class="t">🏋️ Najdłuższy trening</div>'+leaderOf(timeMin,'min')+'</div>'
    +'<div class="statcard"><div class="t">🚴 Najwięcej km (rower)</div>'+leaderOf(r=>Math.round(bikeKm(r)),'km')+'</div>'
    +'<div class="statcard"><div class="t">🚶 Najwięcej km (spacer)</div>'+leaderOf(r=>Math.round(walkKm(r)),'km')+'</div>'
    +'</div>';

  // ── TAB 4: Tydzień (tylko bieżący tydzień) ──
  const wkRows=rows.slice().sort((a,b)=>b.week-a.week||b.cur.activeDaysAll-a.cur.activeDaysAll);
  let t4='<div style="text-align:center;font-size:.78rem;color:#9c4a16;font-weight:800;padding:.6rem 0 .2rem">🗓️ Tydzień '+wn+' ('+weekRangeFor(wn,challengeStart)+')</div>'
    +'<div class="panel">'+wkRows.map((r,i)=>{
      const med=['🥇','🥈','🥉'][i];
      return '<div class="row'+(i<3?' top'+(i+1):'')+'" style="cursor:default"><span class="rk'+(med?' med':'')+'">'+(med||(i+1))+'</span>'
        +'<div class="nm"><b>'+esc(r.name)+'</b><span class="sub">'+r.cur.activeDaysAll+' dni'+(r.cur.runBonus?' · +'+r.cur.runBonus+' bieg':'')+'</span></div>'
        +'<div class="pt"><div class="big">'+r.week+'</div></div></div>';
    }).join('')+'</div>';

  // ── TAB 5: Legenda ──
  let t5='<div class="legend" open><details open><summary>ℹ️ Jak czytać tabelę</summary><div class="lg">'
    +'🥇🥈🥉 — miejsca 1–3 w klasyfikacji ogólnej (narastająco).<br>'
    +'<b class="ok">✅ zielony</b> — aktywność zaliczona (spełnia minimum), z punktami.<br>'
    +'<b class="no">❌ czerwony</b> — poniżej minimum, nie liczy się.<br>'
    +'🏃 Bieg · 🚶 Spacer · 🚴 Rower · 🏊 Pływanie · 🏋️🧘 Trening na czas.<br><br>'
    +'<b>Minima</b> (z 5% tolerancją GPS): bieg 3 km, spacer 3 km, rower 8 km, pływanie 0,8 km, trening 30 min.<br>'
    +'<b>Punkty dnia</b> = 20 (za aktywny dzień) + punkty z aktywności (limit 75 pkt na aktywność).<br>'
    +'<b>Bonus biegowy</b>: 2/3/4 dni z biegiem w tygodniu → +10/+25/+50.<br>'
    +'<b>Wynik tygodnia</b> = najlepsze 5 dni + bonus biegowy. <b>Bez drużyn, bez punktów ujemnych.</b><br>'
    +'<b>Razem</b> = suma zamkniętych tygodni + bieżący tydzień.'
    +'</div></details></div>';

  // #stats (panel administratora — tylko przy #stats w adresie)
  const usage=(location.hash==='#stats')?usagePanel():'';

  document.getElementById('app').innerHTML=usage
    +'<div class="info-bar"><div class="info-box"><b>'+monthName+' · Tydzień '+wn+'</b> ('+weekRangeFor(wn,challengeStart)+') · Aktualizacja: '+updDate
    +'<br><span style="font-size:.73rem">Jedna wspólna klasyfikacja — bez podziału na drużyny. Strona odświeża się automatycznie po zmianach admina.</span></div></div>'
    +'<div class="tab-wrap"><div class="tab-bar">'
    +'<label id="tb1" class="active" onclick="showTab(1)">🏆 Wyniki</label>'
    +'<label id="tb2" onclick="showTab(2)">📋 Klasyfikacja</label>'
    +'<label id="tb3" onclick="showTab(3)">📊 Statystyki</label>'
    +'<label id="tb4" onclick="showTab(4)">🗓️ Tydzień</label>'
    +'<label id="tb5" onclick="showTab(5)">ℹ️ Legenda</label>'
    +'</div>'
    +'<div class="tab-pane active" id="px1">'+t1+'</div>'
    +'<div class="tab-pane" id="px2">'+t2+'</div>'
    +'<div class="tab-pane" id="px3">'+t3+'</div>'
    +'<div class="tab-pane" id="px4">'+t4+'</div>'
    +'<div class="tab-pane" id="px5">'+t5+'</div>'
    +'</div>';
  showTab(currentTab);
  // podłącz śledzenie rozwijania zawodników
  document.querySelectorAll('#px1 details').forEach(d=>d.addEventListener('toggle',()=>{ if(d.open) track('rozwiń-zawodnika'); }));
}

// ── PRZEŁĄCZANIE ZAKŁADEK ──
let currentTab=1;
const TAB_NAMES={1:'Wyniki',2:'Klasyfikacja',3:'Statystyki',4:'Tydzień',5:'Legenda'};
function showTab(n){ currentTab=n; for(let i=1;i<=5;i++){const p=document.getElementById('px'+i),b=document.getElementById('tb'+i);if(p)p.classList.toggle('active',i===n);if(b)b.classList.toggle('active',i===n);} track('zakładka:'+(TAB_NAMES[n]||n)); }

// ── STATYSTYKI UŻYCIA (localStorage, widoczne pod adresem …#stats) ──
const AN_KEY='zabawa_usage_v1';
function track(ev){ try{const o=JSON.parse(localStorage.getItem(AN_KEY)||'{}');o[ev]=(o[ev]||0)+1;localStorage.setItem(AN_KEY,JSON.stringify(o));}catch(e){} }
function usagePanel(){
  let o={}; try{o=JSON.parse(localStorage.getItem(AN_KEY)||'{}');}catch(e){}
  const keys=Object.keys(o).sort((a,b)=>o[b]-o[a]); const max=Math.max(1,...keys.map(k=>o[k]));
  if(!keys.length) return '<div class="usage"><h3>📊 Statystyki użycia (to urządzenie)</h3><div style="font-size:.76rem;opacity:.8">Brak danych jeszcze — używaj zakładek, a liczby pojawią się tutaj.</div></div>';
  return '<div class="usage"><h3>📊 Statystyki użycia (to urządzenie)</h3>'
    +keys.map(k=>'<div class="ubar"><span class="ul">'+esc(k)+'</span><span class="ut" style="width:'+Math.round(o[k]/max*160)+'px"></span><span class="uv">'+o[k]+'</span></div>').join('')
    +'<div style="font-size:.68rem;opacity:.65;margin-top:.5rem">Liczone tylko na tym urządzeniu (localStorage). Anonimowe — żadnych danych osobowych.</div></div>';
}

// ── WCZYTYWANIE DANYCH ──
let _lastStamp=null;
async function fetchResults(){ const r=await fetch(RESULTS_URL+'?t='+Date.now(),{cache:'no-store'}); if(r.status===404)return{missing:true}; if(!r.ok)throw new Error('HTTP '+r.status); return{payload:await r.json()}; }
async function loadAndRender(){ try{ const res=await fetchResults(); if(res.missing){document.getElementById('app').innerHTML='<div class="center-msg">Brak opublikowanych wyników jeszcze.<br><br>Pojawią się, gdy administrator pierwszy raz zapisze dane.</div>';return;} _lastStamp=res.payload?res.payload.lastUpdated:null; renderApp(res.payload);}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="center-msg">⚠️ Nie udało się wczytać wyników. Sprawdź połączenie lub odśwież stronę.</div>';} }
async function checkForUpdates(){ if(document.hidden)return; try{const res=await fetchResults(); if(res.missing)return; const stamp=res.payload?res.payload.lastUpdated:null; if(stamp!==_lastStamp){_lastStamp=stamp;renderApp(res.payload);}}catch(e){} }
function manualRefresh(){ const i=document.getElementById('liveIndicator'); if(i)i.textContent='⏳ Odświeżanie…'; track('odśwież'); loadAndRender(); }

// ── INIT ──
track('wejście');
loadAndRender();
setInterval(checkForUpdates,REFRESH_MS);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)checkForUpdates(); });
window.addEventListener('hashchange',()=>loadAndRender());
</script>
</body>
